name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # The integration test starts its own Horizon stub on a loopback port and
      # overrides this at runtime. It is set here so the suite never reaches the
      # public testnet even if a test forgets to override it.
      STELLAR_NETWORK: TESTNET
      STELLAR_HORIZON_URL: http://127.0.0.1:1
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  frontend:
    name: Frontend — lint, typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api
      NEXT_PUBLIC_STELLAR_NETWORK: TESTNET

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  root-tests:
    name: Shared export tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: node --test tests/*.test.mjs
