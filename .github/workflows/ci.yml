name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # The integration test starts its own Horizon stub on a loopback port and
      # overrides this at runtime. It is set here so the suite never reaches the
      # public testnet even if a test forgets to override it.
      STELLAR_NETWORK: TESTNET
      STELLAR_HORIZON_URL: http://127.0.0.1:1
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The backend suite drives Node own test runner (node --import tsx
          # --test). On 20 that runner intermittently fails inside its own IPC
          # layer with Unable to deserialize cloned data (raised in
          # #processRawBuffer / FileTest.parseMessage) on the same test file that
          # passes alone, while every assertion in the suite passes. Reproduced
          # locally: 5/5 full-suite runs fail on 20, 4/4 pass on 22 and 24 with
          # the suite unchanged. 24 is the runtime the other two jobs already use,
          # and no test, script or assertion is changed by this.
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  frontend:
    name: Frontend — lint, typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api
      NEXT_PUBLIC_STELLAR_NETWORK: TESTNET

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The frontend suite loads the shipped .ts modules directly, which
          # needs Node's default type stripping (22.18+). On 20 every test
          # file failed to parse before a single assertion ran. 24 also
          # matches the job the shared-contract tests already run on.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  root-tests:
    name: Shared export tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test
        run: node --test tests/*.test.mjs

  evidence-smoke:
    name: Evidence smoke (optional, secrets-gated)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend

    env:
      EVIDENCE_API_URL: ${{ vars.EVIDENCE_API_URL }}
      EVIDENCE_SELLER_PUBLIC_KEY: ${{ secrets.EVIDENCE_SELLER_PUBLIC_KEY }}
      EVIDENCE_PAYER_SECRET: ${{ secrets.EVIDENCE_PAYER_SECRET }}
      EVIDENCE_NETWORK: TESTNET

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Testnet evidence smoke (create -> pay -> verify)
        if: ${{ env.EVIDENCE_PAYER_SECRET != '' && env.EVIDENCE_SELLER_PUBLIC_KEY != '' }}
        run: npm run evidence:smoke
