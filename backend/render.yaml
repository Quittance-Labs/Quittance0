# Render Blueprint — Quittance MVP API (in-memory)
# Dashboard: New → Blueprint → connect this repo, or create a Web Service manually.
# Root directory: backend

services:
  - type: web
    name: quittance-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:mvp:prod
    healthCheckPath: /api/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: STELLAR_NETWORK
        value: TESTNET
      - key: STELLAR_HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: ALLOW_SIMULATE
        value: "false"
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
